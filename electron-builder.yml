appId: com.lk-harness.desktop
productName: LK Harness
copyright: Copyright © 2026

publish:
  provider: github
  owner: lk-eternal
  repo: lk-harness
  vPrefixedTagName: true

afterPack: scripts/after-pack.cjs

directories:
  buildResources: resources
  output: release

files:
  - out/**/*

asarUnpack:
  - node_modules/@cursor/sdk-*/bin/*
  - node_modules/sqlite3/**/*.node

extraResources:
  - from: dist-bundle/
    to: daemon/
    filter:
      - "*.mjs"
      - "*.map"
  - from: node_modules/node-cron
    to: daemon/node_modules/node-cron
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/template
    to: template
  - from: changelog.json
    to: changelog.json

win:
  icon: resources/icon.ico
  artifactName: lk-harness-setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: LK Harness

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: public.app-category.developer-tools

dmg:
  title: LK Harness

linux:
  icon: resources/icon.png
  maintainer: lk-eternal
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
