<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Diff Viewer</title>
<!-- AI 只需替换 #diff-data 内 JSON，结构见脚本末尾 DIFF_DATA_SCHEMA -->
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel-2:#21262d;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#388bfd;--add-bg:rgba(46,160,67,.22);--add-text:#aff5b4;--del-bg:rgba(248,81,73,.22);--del-text:#ffdcd7;--empty:#1c2128;--sidebar-w:300px;--ln-w:44px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.45;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
[hidden]{display:none!important}
.page-header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.page-header h1{margin:0 0 6px;font-size:1.1rem;font-weight:600}
.meta{color:var(--muted);font-size:.8125rem;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.meta code{color:var(--text);font-family:ui-monospace,Consolas,monospace}
.meta-toggle,.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.75rem;font:inherit;line-height:1.3}
.meta-toggle:hover,.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.view-switch{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.view-switch button{border:none;background:transparent;color:var(--muted);padding:4px 10px;font-size:.75rem;cursor:pointer;font:inherit}
.view-switch button[aria-pressed="true"]{background:rgba(56,139,253,.18);color:var(--accent)}
.diff-toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:3}
.nav-switch{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.nav-switch button{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:6px 10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:6px;cursor:pointer;font:inherit;font-size:.75rem;line-height:1}
.nav-switch button svg{width:14px;height:14px;flex:0 0 auto;fill:currentColor}
.nav-switch button:disabled{opacity:.35;cursor:not-allowed}
.file-picker-btn{display:none;max-width:min(100%,280px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta-extra{margin-top:10px;width:100%}
.stat{padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;white-space:pre-wrap;max-height:160px;overflow:auto}
.commits ul{margin:6px 0 0;padding-left:18px;font-size:.8125rem}
.commits code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
.workspace{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
.sidebar{flex:0 0 var(--sidebar-w);width:var(--sidebar-w);border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sidebar-head{padding:10px 12px;font-size:.75rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
.file-list{flex:1;overflow:auto;padding:6px;-webkit-overflow-scrolling:touch}
.file-item{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 8px;width:100%;text-align:left;border:1px solid transparent;border-radius:6px;padding:8px 10px;margin-bottom:4px;background:transparent;color:var(--text);cursor:pointer;font:inherit}
.file-item:hover{background:var(--panel-2);border-color:var(--border)}
.file-item.active{background:rgba(56,139,253,.12);border-color:rgba(56,139,253,.45)}
.file-name{grid-column:1;font-family:ui-monospace,Consolas,monospace;font-size:.8125rem;font-weight:600;word-break:break-all}
.file-dir{grid-column:1;font-size:.7rem;color:var(--muted);word-break:break-all}
.file-stats{grid-column:2;grid-row:1/span 2;align-self:center;display:flex;flex-direction:column;gap:2px;font-family:ui-monospace,Consolas,monospace;font-size:.7rem}
.stat-add{color:var(--add-text)}.stat-del{color:var(--del-text)}
.diff-pane{flex:1 1 auto;min-width:0;min-height:0;background:var(--bg);display:flex;flex-direction:column;position:relative}
.diff-viewport{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.diff-placeholder{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem;background:var(--bg);padding:16px;text-align:center}
.diff-scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.diff-file-header{position:sticky;top:0;z-index:2;background:var(--panel-2);border-bottom:1px solid var(--border);padding:10px 14px}
.diff-file-header h2{margin:0;font-size:.85rem;font-family:ui-monospace,Consolas,monospace;font-weight:500;word-break:break-all}
.hunk-header{padding:6px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--accent);background:rgba(56,139,253,.08);border-bottom:1px solid var(--border)}
.hunk-columns,.full-columns{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border-bottom:1px solid var(--border);position:sticky;top:41px;z-index:1}
.col-title{padding:6px 12px 6px calc(var(--ln-w) + 12px);font-size:.72rem;color:var(--muted)}
.col-title.left{border-right:1px solid var(--border)}
.hunk-body{border-bottom:8px solid var(--panel)}
.diff-row{display:grid;grid-template-columns:1fr 1px 1fr;border-bottom:1px solid rgba(48,54,61,.45)}
.diff-row.row-hidden{display:none}
.diff-row.row-change-focus{outline:1px solid var(--accent);outline-offset:-1px}
.row-sep{background:var(--border)}
.side-cell{display:grid;grid-template-columns:var(--ln-w) minmax(0,1fr);min-width:0}
.side-cell .ln{text-align:right;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;line-height:1.45;color:var(--muted);user-select:none;background:rgba(0,0,0,.2);border-right:1px solid rgba(48,54,61,.6)}
.side-cell .code{margin:0;padding:1px 10px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.78rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.side-cell.ctx .code{color:var(--text)}
.side-cell.del{background:var(--del-bg)}.side-cell.del .code{color:var(--del-text)}
.side-cell.add{background:var(--add-bg)}.side-cell.add .code{color:var(--add-text)}
.side-cell.empty{background:var(--empty)}.side-cell.empty .code{color:transparent}
.full-split{display:grid;grid-template-columns:1fr 1px 1fr;border-bottom:8px solid var(--panel)}
.full-sep{background:var(--border)}.full-col{min-width:0}
.full-line{display:grid;grid-template-columns:var(--ln-w) minmax(0,1fr);border-bottom:1px solid rgba(48,54,61,.35)}
.full-line .ln{text-align:right;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;line-height:1.45;color:var(--muted);user-select:none;background:rgba(0,0,0,.2);border-right:1px solid rgba(48,54,61,.6)}
.full-line .code{margin:0;padding:1px 10px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--text)}
.full-line.del{background:var(--del-bg)}.full-line.del .code{color:var(--del-text)}
.full-line.add{background:var(--add-bg)}.full-line.add .code{color:var(--add-text)}
.full-empty{padding:24px 14px;color:var(--muted);font-size:.8125rem;text-align:center}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.file-drawer{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:min(72dvh,520px);background:var(--panel);border-top:1px solid var(--border);border-radius:12px 12px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.file-drawer.open{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.drawer-head h2{margin:0;font-size:.9rem;font-weight:600}
.drawer-close{border:none;background:var(--panel-2);color:var(--text);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;font-size:.8125rem}
@media (max-width:768px){
  .sidebar{display:none}.file-picker-btn{display:inline-block}.diff-pane{flex:1}
  .hunk-columns,.full-columns{top:0}.diff-file-header{padding:8px 12px}
  .side-cell .code,.full-line .code{font-size:.8125rem}.col-title{display:none}
  .diff-row{grid-template-columns:1fr}.full-split{grid-template-columns:1fr}
  .full-sep,.row-sep{display:none}
  .diff-row.row-ctx .side-cell.ctx:last-of-type{display:none}
  .side-cell.del,.side-cell.add{border-bottom:1px solid rgba(48,54,61,.35)}
  .side-cell.empty{display:none}
  .diff-row:has(.side-cell.del:not(.empty)) .side-cell.add.empty,
  .diff-row:has(.side-cell.add:not(.empty)) .side-cell.del.empty{display:none}
}
@media (min-width:769px){.drawer-backdrop,.file-drawer{display:none!important}}
</style>
</head>
<body data-view="diff">
<header class="page-header">
  <h1>分支 Diff 查看器</h1>
  <div class="meta">
    <span>基线 <code id="meta-base">—</code></span>
    <span>对比 <code id="meta-head">—</code></span>
    <span id="meta-count">0 个文件</span>
    <div class="view-switch" role="group" aria-label="视图模式">
      <button type="button" id="view-diff" aria-pressed="true">只看 diff</button>
      <button type="button" id="view-full" aria-pressed="false">展开全文</button>
    </div>
    <button type="button" class="btn-ghost file-picker-btn" id="file-picker-btn" aria-expanded="false">选择文件</button>
    <button type="button" class="meta-toggle" id="meta-toggle">提交与统计</button>
  </div>
  <div class="meta-extra" id="meta-extra" hidden>
    <div class="stat" id="meta-stat"></div>
    <section class="commits"><strong>提交列表</strong><ul id="meta-commits"></ul></section>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar" aria-label="变更文件">
    <div class="sidebar-head" id="sidebar-head">变更文件 (0)</div>
    <div class="file-list" id="file-list"></div>
  </aside>
  <section class="diff-pane">
    <div class="diff-toolbar" id="diff-toolbar" hidden>
      <div class="nav-switch" role="group" aria-label="跳转">
        <button type="button" id="nav-prev-change" title="上一处改动"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l5 5H9v5H7V8H3l5-5z"/></svg><span>上一处</span></button>
        <button type="button" id="nav-next-change" title="下一处改动"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13l-5-5h4V3h2v5h4l-5 5z"/></svg><span>下一处</span></button>
        <button type="button" id="nav-prev-file" title="上一个文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5V3z"/></svg><span>上一文件</span></button>
        <button type="button" id="nav-next-file" title="下一个文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3v10l5-5-5-5z"/></svg><span>下一文件</span></button>
      </div>
    </div>
    <div class="diff-viewport">
      <div class="diff-placeholder" id="diff-placeholder">← 选择文件查看 Diff</div>
      <div class="diff-scroll" id="diff-scroll" hidden><div id="file-panel"></div></div>
    </div>
  </section>
</div>
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<div class="file-drawer" id="file-drawer" aria-hidden="true" hidden>
  <div class="drawer-head"><h2 id="drawer-head">变更文件</h2><button type="button" class="drawer-close" id="drawer-close">关闭</button></div>
  <div class="file-list" id="file-list-drawer"></div>
</div>
<script type="application/json" id="diff-data">{"baseLabel":"BASE","headLabel":"HEAD","stat":"","commits":[],"files":[]}</script>
<script>
(function () {
  var CONTEXT = 2;
  var data = JSON.parse(document.getElementById("diff-data").textContent);
  var panel = document.getElementById("file-panel");
  var ph = document.getElementById("diff-placeholder");
  var sc = document.getElementById("diff-scroll");
  var fileList = document.getElementById("file-list");
  var currentIndex = -1;
  var cacheKey = "";
  var changeFocusIdx = -1;

  function mobile() { return window.matchMedia("(max-width:768px)").matches; }
  function viewMode() { return document.body.getAttribute("data-view") || "diff"; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) {
      if (tag === "pre") { n.className = "code"; n.textContent = text; }
      else n.textContent = text;
    }
    return n;
  }

  function sideCell(ln, code, kind) {
    var c = el("div", "side-cell " + kind);
    c.appendChild(el("span", "ln", ln != null ? String(ln) : ""));
    c.appendChild(el("pre", null, code != null ? code : " "));
    return c;
  }

  function diffRow(row) {
    var r = el("div", "diff-row");
    if (row[0] === "c") {
      r.classList.add("row-ctx");
      var o = row[1], n = row[2], t = row[3];
      r.appendChild(sideCell(mobile() && o !== n ? o + "→" + n : o, t, "ctx"));
      r.appendChild(el("div", "row-sep"));
      r.appendChild(sideCell(n, t, "ctx"));
    } else if (row[0] === "d") {
      r.classList.add("row-change");
      r.appendChild(sideCell(row[1], row[2], "del"));
      r.appendChild(el("div", "row-sep"));
      r.appendChild(sideCell(null, " ", "empty"));
    } else if (row[0] === "a") {
      r.classList.add("row-change");
      r.appendChild(sideCell(null, " ", "empty"));
      r.appendChild(el("div", "row-sep"));
      r.appendChild(sideCell(row[1], row[2], "add"));
    }
    return r;
  }

  function renderDiff(file, compact) {
    var art = el("article", "file-view");
    var hdr = el("header", "diff-file-header");
    hdr.appendChild(el("h2", null, file.path));
    art.appendChild(hdr);
    file.hunks.forEach(function (h) {
      art.appendChild(el("div", "hunk-header", h.h));
      var cols = el("div", "hunk-columns");
      cols.appendChild(el("div", "col-title left", "基线 (" + data.baseLabel + ")"));
      cols.appendChild(el("div", "col-title right", "当前 (" + data.headLabel + ")"));
      art.appendChild(cols);
      var body = el("div", "hunk-body");
      h.r.forEach(function (row) { body.appendChild(diffRow(row)); });
      art.appendChild(body);
    });
    if (compact) {
      var rows = art.querySelectorAll(".diff-row");
      var changeAt = [];
      rows.forEach(function (r, idx) {
        if (r.classList.contains("row-ctx")) return;
        changeAt.push(idx);
      });
      rows.forEach(function (r, idx) {
        if (!r.classList.contains("row-ctx")) return;
        var near = changeAt.some(function (ci) { return Math.abs(ci - idx) <= CONTEXT; });
        if (!near) r.classList.add("row-hidden");
      });
    }
    return art;
  }

  function fileForView(file) {
    if (viewMode() !== "full") return file;
    if (file.fullHunks && file.fullHunks.length) return { path: file.path, hunks: file.fullHunks };
    return file;
  }

  function renderFile(i, force) {
    var file = data.files[i];
    var view = viewMode();
    var key = i + "|" + view + "|" + (mobile() ? "m" : "d");
    if (!force && key === cacheKey && panel.firstChild) return;
    cacheKey = key;
    changeFocusIdx = -1;
    panel.innerHTML = "";
    panel.appendChild(renderDiff(fileForView(file), view === "diff"));
    clearChangeFocus();
    updateNavButtons();
  }

  /** 可见的连续变动行合并为一处，返回每处第一行 */
  function changeRegions() {
    var all = panel.querySelectorAll(".diff-row");
    var regions = [];
    var inRegion = false;
    var start = null;
    all.forEach(function (r) {
      if (r.classList.contains("row-hidden")) return;
      if (r.classList.contains("row-change")) {
        if (!inRegion) {
          inRegion = true;
          start = r;
        }
      } else if (inRegion) {
        regions.push(start);
        inRegion = false;
        start = null;
      }
    });
    if (inRegion) regions.push(start);
    return regions;
  }

  function clearChangeFocus() {
    panel.querySelectorAll(".diff-row.row-change-focus").forEach(function (r) {
      r.classList.remove("row-change-focus");
    });
  }

  function scrollToChangeRow(row) {
    if (!row) return;
    clearChangeFocus();
    row.classList.add("row-change-focus");
    row.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function scrollToFirstChange() {
    var regs = changeRegions();
    changeFocusIdx = regs.length ? 0 : -1;
    scrollToChangeRow(regs[0]);
    updateNavButtons();
  }

  function gotoChange(delta) {
    var regs = changeRegions();
    if (!regs.length) return;
    if (changeFocusIdx < 0) changeFocusIdx = delta > 0 ? 0 : regs.length - 1;
    else changeFocusIdx = (changeFocusIdx + delta + regs.length) % regs.length;
    scrollToChangeRow(regs[changeFocusIdx]);
    updateNavButtons();
  }

  function updateNavButtons() {
    var n = data.files.length;
    var regs = changeRegions();
    document.getElementById("nav-prev-file").disabled = n <= 1;
    document.getElementById("nav-next-file").disabled = n <= 1;
    document.getElementById("nav-prev-change").disabled = !regs.length;
    document.getElementById("nav-next-change").disabled = !regs.length;
  }

  function gotoFile(delta, toFirstChange) {
    var n = data.files.length;
    if (n <= 1) return;
    var next = (currentIndex + delta + n) % n;
    show(next, toFirstChange);
  }

  function fileButton(file, idx) {
    var parts = file.path.split("/");
    var name = parts.pop();
    var dir = parts.join("/");
    var b = el("button", "file-item");
    b.type = "button";
    b.setAttribute("data-index", String(idx));
    b.appendChild(el("span", "file-name", name));
    b.appendChild(el("span", "file-dir", dir));
    var st = el("span", "file-stats");
    st.appendChild(el("span", "stat-add", "+" + file.add));
    st.appendChild(el("span", "stat-del", "-" + file.del));
    b.appendChild(st);
    b.addEventListener("click", function () { show(idx); });
    return b;
  }

  function show(i, toFirstChange) {
    i = Number(i);
    currentIndex = i;
    ph.setAttribute("hidden", "");
    sc.removeAttribute("hidden");
    document.getElementById("diff-toolbar").removeAttribute("hidden");
    cacheKey = "";
    renderFile(i, true);
    fileList.querySelectorAll(".file-item").forEach(function (b) {
      b.classList.toggle("active", Number(b.getAttribute("data-index")) === i);
    });
    var picker = document.getElementById("file-picker-btn");
    var f = data.files[i];
    if (picker && f) picker.textContent = f.path.split("/").pop();
    sc.scrollTop = 0;
    if (toFirstChange) requestAnimationFrame(scrollToFirstChange);
    else updateNavButtons();
  }

  function initMeta() {
    document.getElementById("meta-base").textContent = data.baseLabel;
    document.getElementById("meta-head").textContent = data.headLabel;
    var n = data.files.length;
    var nc = (data.commits || []).length;
    document.getElementById("meta-count").textContent = n + " 个文件 · " + nc + " 提交";
    document.getElementById("sidebar-head").textContent = "变更文件 (" + n + ")";
    document.getElementById("drawer-head").textContent = "变更文件 (" + n + ")";
    document.getElementById("meta-stat").textContent = data.stat || "";
    var ul = document.getElementById("meta-commits");
    ul.innerHTML = "";
    (data.commits || []).forEach(function (c) {
      var li = document.createElement("li");
      var code = document.createElement("code");
      code.textContent = c;
      li.appendChild(code);
      ul.appendChild(li);
    });
  }

  function buildLists() {
    fileList.innerHTML = "";
    data.files.forEach(function (f, i) { fileList.appendChild(fileButton(f, i)); });
  }

  document.getElementById("view-diff").addEventListener("click", function () {
    document.body.setAttribute("data-view", "diff");
    document.getElementById("view-diff").setAttribute("aria-pressed", "true");
    document.getElementById("view-full").setAttribute("aria-pressed", "false");
    cacheKey = "";
    if (currentIndex >= 0) renderFile(currentIndex, true);
  });
  document.getElementById("view-full").addEventListener("click", function () {
    document.body.setAttribute("data-view", "full");
    document.getElementById("view-diff").setAttribute("aria-pressed", "false");
    document.getElementById("view-full").setAttribute("aria-pressed", "true");
    cacheKey = "";
    if (currentIndex >= 0) renderFile(currentIndex, true);
  });
  document.getElementById("nav-prev-file").addEventListener("click", function () { gotoFile(-1, true); });
  document.getElementById("nav-next-file").addEventListener("click", function () { gotoFile(1, true); });
  document.getElementById("nav-prev-change").addEventListener("click", function () { gotoChange(-1); });
  document.getElementById("nav-next-change").addEventListener("click", function () { gotoChange(1); });
  document.getElementById("meta-toggle").addEventListener("click", function () {
    var ex = document.getElementById("meta-extra");
    var o = ex.hasAttribute("hidden");
    if (o) ex.removeAttribute("hidden"); else ex.setAttribute("hidden", "");
    this.textContent = o ? "收起详情" : "提交与统计";
  });
  var drawer = document.getElementById("file-drawer");
  var backdrop = document.getElementById("drawer-backdrop");
  document.getElementById("file-picker-btn").addEventListener("click", function () {
    var dl = document.getElementById("file-list-drawer");
    dl.innerHTML = "";
    data.files.forEach(function (f, i) {
      var c = fileButton(f, i);
      c.addEventListener("click", function () {
        show(i);
        drawer.classList.remove("open");
        backdrop.classList.remove("open");
        drawer.setAttribute("hidden", "");
        backdrop.setAttribute("hidden", "");
      });
      dl.appendChild(c);
    });
    drawer.removeAttribute("hidden");
    backdrop.removeAttribute("hidden");
    requestAnimationFrame(function () { drawer.classList.add("open"); backdrop.classList.add("open"); });
  });
  document.getElementById("drawer-close").addEventListener("click", function () {
    drawer.classList.remove("open");
    backdrop.classList.remove("open");
    setTimeout(function () { drawer.setAttribute("hidden", ""); backdrop.setAttribute("hidden", ""); }, 260);
  });
  backdrop.addEventListener("click", function () {
    drawer.classList.remove("open");
    backdrop.classList.remove("open");
    setTimeout(function () { drawer.setAttribute("hidden", ""); backdrop.setAttribute("hidden", ""); }, 260);
  });
  window.matchMedia("(max-width:768px)").addEventListener("change", function () {
    cacheKey = "";
    if (currentIndex >= 0) renderFile(currentIndex);
  });

  initMeta();
  buildLists();
  if (data.files.length) show(0);
  else ph.textContent = "暂无变更文件";
})();
/* DIFF_DATA_SCHEMA — files[]: { path, add, del, base[], head[], delLines[], addLines[], hunks[], fullHunks[] }
   fullHunks: 展开全文用（全文件对齐行，可由 git diff -U999999 生成）；hunks: 只看 diff
   c: ["c", oldLn, newLn, text]  d: ["d", oldLn, text]  a: ["a", newLn, text] */
</script>
