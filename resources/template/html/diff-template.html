<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Diff Viewer</title>
<!-- render_branch_diff 注入 #diff-data、diff2html-ui 与 diff-hybrid-runtime -->
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel-2:#21262d;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#388bfd;--add-bg:rgba(46,160,67,.22);--add-text:#aff5b4;--del-bg:rgba(248,81,73,.22);--del-text:#ffdcd7;--empty:#1c2128;--sidebar-w:300px;--ln-w:44px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.45;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
[hidden]{display:none!important}
.page-header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.page-header h1{margin:0 0 6px;font-size:1.1rem;font-weight:600}
.meta{color:var(--muted);font-size:.8125rem;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.meta code{color:var(--text);font-family:ui-monospace,Consolas,monospace}
.meta-toggle,.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.75rem;font:inherit;line-height:1.3}
.meta-toggle:hover,.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.diff-toolbar{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:3}
.toolbar-row{display:flex;flex-wrap:wrap;gap:6px;width:100%;align-items:center}
.search-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%}
.search-input{flex:1 1 160px;min-width:0;min-height:36px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:.8125rem}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,139,253,.25)}
.search-count{flex:0 0 auto;font-size:.75rem;color:var(--muted);min-width:3.5em;text-align:center;font-variant-numeric:tabular-nums}
.search-nav{min-width:36px;min-height:36px;padding:6px 8px;font-size:.875rem;line-height:1}
.pane-toggle{min-height:36px;padding:6px 10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:6px;cursor:pointer;font:inherit;font-size:.75rem;line-height:1.2}
.pane-toggle[aria-pressed="true"]{background:rgba(56,139,253,.18);border-color:rgba(56,139,253,.45);color:var(--accent)}
.nav-btn{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:6px 10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:6px;cursor:pointer;font:inherit;font-size:.75rem;line-height:1}
.nav-btn svg{width:14px;height:14px;flex:0 0 auto;fill:currentColor}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.file-picker-btn{display:none;max-width:min(100%,280px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta-extra{margin-top:10px;width:100%}
.stat{padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;white-space:pre-wrap;max-height:160px;overflow:auto}
.commits ul{margin:6px 0 0;padding-left:18px;font-size:.8125rem}
.commits code{font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
.workspace{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
.sidebar{flex:0 0 var(--sidebar-w);width:var(--sidebar-w);border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sidebar-head{padding:10px 12px;font-size:.75rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
.file-list{flex:1;overflow:auto;padding:6px;-webkit-overflow-scrolling:touch}
.file-item{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 8px;width:100%;text-align:left;border:1px solid transparent;border-radius:6px;padding:8px 10px;margin-bottom:4px;background:transparent;color:var(--text);cursor:pointer;font:inherit}
.file-item:hover{background:var(--panel-2);border-color:var(--border)}
.file-item.active{background:rgba(56,139,253,.12);border-color:rgba(56,139,253,.45)}
.file-name{grid-column:1;font-family:ui-monospace,Consolas,monospace;font-size:.8125rem;font-weight:600;word-break:break-all}
.file-dir{grid-column:1;font-size:.7rem;color:var(--muted);word-break:break-all}
.file-stats{grid-column:2;grid-row:1/span 2;align-self:center;display:flex;flex-direction:column;gap:2px;font-family:ui-monospace,Consolas,monospace;font-size:.7rem}
.stat-add{color:var(--add-text)}.stat-del{color:var(--del-text)}
.diff-pane{flex:1 1 auto;min-width:0;min-height:0;background:var(--bg);display:flex;flex-direction:column;position:relative}
.diff-viewport{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.diff-placeholder{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem;background:var(--bg);padding:16px;text-align:center}
.diff-scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.diff-file-header{position:sticky;top:0;z-index:2;background:var(--panel-2);border-bottom:1px solid var(--border);padding:10px 14px}
.diff-file-header h2{margin:0;font-size:.85rem;font-family:ui-monospace,Consolas,monospace;font-weight:500;word-break:break-all}
.hunk-header{padding:6px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--accent);background:rgba(56,139,253,.08);border-bottom:1px solid var(--border)}
.hunk-columns,.full-columns{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border-bottom:1px solid var(--border);position:sticky;top:41px;z-index:1}
.col-title{padding:6px 12px 6px calc(var(--ln-w) + 12px);font-size:.72rem;color:var(--muted)}
.col-title.left{border-right:1px solid var(--border)}
.hunk-body{border-bottom:8px solid var(--panel)}
.diff-row{display:grid;grid-template-columns:1fr 1px 1fr;border-bottom:1px solid rgba(48,54,61,.45)}
.diff-row.row-hidden{display:none}
.diff-row.row-change-focus{outline:1px solid var(--accent);outline-offset:-1px}
.row-sep{background:var(--border)}
.side-cell{display:grid;grid-template-columns:var(--ln-w) minmax(0,1fr);min-width:0}
.side-cell .ln{text-align:right;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;line-height:1.45;color:var(--muted);user-select:none;background:rgba(0,0,0,.2);border-right:1px solid rgba(48,54,61,.6)}
.side-cell .code{margin:0;padding:1px 10px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.78rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.side-cell.ctx .code{color:var(--text)}
.side-cell.del{background:var(--del-bg)}.side-cell.del .code{color:var(--del-text)}
.side-cell.add{background:var(--add-bg)}.side-cell.add .code{color:var(--add-text)}
.side-cell.empty{background:var(--empty)}.side-cell.empty .code{color:transparent}
.full-split{display:grid;grid-template-columns:1fr 1px 1fr;border-bottom:8px solid var(--panel)}
.full-sep{background:var(--border)}.full-col{min-width:0}
.full-line{display:grid;grid-template-columns:var(--ln-w) minmax(0,1fr);border-bottom:1px solid rgba(48,54,61,.35)}
.full-line .ln{text-align:right;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;line-height:1.45;color:var(--muted);user-select:none;background:rgba(0,0,0,.2);border-right:1px solid rgba(48,54,61,.6)}
.full-line .code{margin:0;padding:1px 10px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--text)}
.full-line.del{background:var(--del-bg)}.full-line.del .code{color:var(--del-text)}
.full-line.add{background:var(--add-bg)}.full-line.add .code{color:var(--add-text)}
.full-empty{padding:24px 14px;color:var(--muted);font-size:.8125rem;text-align:center}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.file-drawer{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:min(72dvh,520px);background:var(--panel);border-top:1px solid var(--border);border-radius:12px 12px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.file-drawer.open{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.drawer-head h2{margin:0;font-size:.9rem;font-weight:600}
.drawer-close{border:none;background:var(--panel-2);color:var(--text);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;font-size:.8125rem}
@media (max-width:768px){
  .sidebar{display:none}.file-picker-btn{display:inline-block}.diff-pane{flex:1}
  .hunk-columns,.full-columns{top:0}.diff-file-header{padding:8px 12px}
  .side-cell .code,.full-line .code{font-size:.8125rem}.col-title{display:none}
  .diff-row{grid-template-columns:1fr}.full-split{grid-template-columns:1fr}
  .full-sep,.row-sep{display:none}
  .diff-row.row-ctx .side-cell.ctx:last-of-type{display:none}
  .side-cell.del,.side-cell.add{border-bottom:1px solid rgba(48,54,61,.35)}
  .side-cell.empty{display:none}
  .diff-row:has(.side-cell.del:not(.empty)) .side-cell.add.empty,
  .diff-row:has(.side-cell.add:not(.empty)) .side-cell.del.empty{display:none}
}
@media (min-width:769px){.drawer-backdrop,.file-drawer{display:none!important}}
</style>
</head>
<body data-view="diff">
<header class="page-header">
  <h1>分支 Diff 查看器</h1>
  <div class="meta">
    <span>基线 <code id="meta-base">—</code></span>
    <span>对比 <code id="meta-head">—</code></span>
    <span id="meta-count">0 个文件</span>
    <button type="button" class="btn-ghost file-picker-btn" id="file-picker-btn" aria-expanded="false">选择文件</button>
    <button type="button" class="meta-toggle" id="meta-toggle">提交与统计</button>
  </div>
  <div class="meta-extra" id="meta-extra" hidden>
    <div class="stat" id="meta-stat"></div>
    <section class="commits"><strong>提交列表</strong><ul id="meta-commits"></ul></section>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar" aria-label="变更文件">
    <div class="sidebar-head" id="sidebar-head">变更文件 (0)</div>
    <div class="file-list" id="file-list"></div>
  </aside>
  <section class="diff-pane">
    <div class="diff-toolbar" id="diff-toolbar" hidden>
      <div class="toolbar-row toolbar-row-main" role="group" aria-label="视图与跳转">
        <button type="button" class="pane-toggle" id="view-diff" aria-pressed="true">只看变更</button>
        <button type="button" class="pane-toggle" id="view-full" aria-pressed="false">展开全文</button>
        <button type="button" class="pane-toggle" id="view-only-before" aria-pressed="false" title="仅显示修改前（基线），再点恢复两侧">只看修改前</button>
        <button type="button" class="pane-toggle" id="view-only-after" aria-pressed="false" title="仅显示修改后（对比端），再点恢复两侧">只看修改后</button>
        <button type="button" class="nav-btn" id="nav-prev-change" title="上一处改动"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l5 5H9v5H7V8H3l5-5z"/></svg><span>上一处</span></button>
        <button type="button" class="nav-btn" id="nav-next-change" title="下一处改动"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13l-5-5h4V3h2v5h4l-5 5z"/></svg><span>下一处</span></button>
        <button type="button" class="nav-btn" id="nav-prev-file" title="上一个文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5V3z"/></svg><span>上一文件</span></button>
        <button type="button" class="nav-btn" id="nav-next-file" title="下一个文件"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3v10l5-5-5-5z"/></svg><span>下一文件</span></button>
      </div>
      <div class="toolbar-row toolbar-row-search search-bar" role="search">
        <input type="search" id="diff-search-input" class="search-input" placeholder="搜索当前文件…" autocomplete="off" enterkeyhint="search"/>
        <span class="search-count" id="diff-search-count" aria-live="polite"></span>
        <button type="button" class="btn-ghost search-nav" id="diff-search-prev" title="上一匹配" disabled>↑</button>
        <button type="button" class="btn-ghost search-nav" id="diff-search-next" title="下一匹配" disabled>↓</button>
      </div>
    </div>
    <div class="diff-viewport">
      <div class="diff-placeholder" id="diff-placeholder">← 选择文件查看 Diff</div>
      <div class="diff-scroll" id="diff-scroll" hidden><div id="file-panel"></div></div>
    </div>
  </section>
</div>
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<div class="file-drawer" id="file-drawer" aria-hidden="true" hidden>
  <div class="drawer-head"><h2 id="drawer-head">变更文件</h2><button type="button" class="drawer-close" id="drawer-close">关闭</button></div>
  <div class="file-list" id="file-list-drawer"></div>
</div>
<script type="application/json" id="diff-data">{"baseLabel":"BASE","headLabel":"HEAD","stat":"","commits":[],"files":[]}</script>
<script></script>
</body>
</html>
