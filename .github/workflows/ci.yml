name: CI

# 直接推 main、以及开 PR 时的快速检查。
# build.yml 只在打 tag 发版时跑（并且打包），直接推 main 的回归要等到发版才暴露；
# 这里只跑测试和类型检查（不打安装包），几分钟内给出结果。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# package-lock.json 里有 301 个包的下载地址是 registry.npmmirror.com（国内镜像）。
# GitHub 的机器连它时好时坏（同一次推送里一个 job 装得上、另一个连试 3 次都装不上）。
# 把这个主机名换成默认源 registry.npmjs.org：路径和包内容一样，已逐个核对 301 个包的 sha512 与锁文件一致。
# 只对 CI 生效，不改 package-lock.json，本地开发不受影响。
env:
  NPM_CONFIG_REPLACE_REGISTRY_HOST: registry.npmmirror.com

jobs:
  check:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 build.yml 一致：产线 Electron 41 内核（Node 24）
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        # npm ci 偶发失败（锁文件里 300 多个包走 npmmirror，GitHub 的机器连它不稳），最多试 3 次；npm ci 每次都会先清空 node_modules，重试是干净的
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci 第 $i 次失败，稍后重试"
            sleep $((i * 10))
          done
          exit 1

      - name: Run tests
        run: npm test

      - name: Typecheck (electron + renderer)
        run: npm run typecheck

  e2e:
    name: E2E (isolated daemon)
    runs-on: ubuntu-latest
    # 端到端测试在 Windows 上验证过，还没在 GitHub 的 Linux 上跑过。
    # 先不让它把 main 标红；看到连续几次绿了，就把下面这行删掉，让它和 check 一样成为硬检查。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        # npm ci 偶发失败（锁文件里 300 多个包走 npmmirror，GitHub 的机器连它不稳），最多试 3 次；npm ci 每次都会先清空 node_modules，重试是干净的
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci 第 $i 次失败，稍后重试"
            sleep $((i * 10))
          done
          exit 1

      - name: Run e2e tests
        run: npm run test:e2e
