name: Build Mobile APK

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/mobile/**"
      - "capacitor.config.json"
      - "vite.mobile.config.ts"
      - ".github/workflows/mobile-apk.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Mobile Web Bundle (out/mobile)
        run: npm run build:mobile

      - name: Generate Capacitor Android Project & Build APK
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 @capacitor/browser@^7.0.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # 1) 允许局域网 HTTP 与公网 HTTPS 双线路访问 (usesCleartextTraffic)
          # 2) 申请相机权限，App 内扫码配对要用（getUserMedia 经 Capacitor 的 WebChromeClient 转成系统授权弹窗）
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'usesCleartextTraffic' not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          if 'android.permission.CAMERA' not in text:
              camera = (
                  '<uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                  '    <application'
              )
              text = text.replace("<application", camera, 1)
          manifest.write_text(text, encoding="utf-8")
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../lk-harness-mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lk-harness-mobile-apk
          path: lk-harness-mobile.apk
          retention-days: 30
